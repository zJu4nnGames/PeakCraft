# Build used by the zJu4nn Hub "Mashups" tab (added in zJu4nn's copy; the original project is untouched).
#   - fabric/ → the Minecraft mod (skycraft-<version>.jar), compiled HERE from this repository's source (JDK 25 +
#               the project's own Gradle wrapper)
#   - peak/   → the PEAK BepInEx plugin compiles against PEAK's own assemblies, which aren't public anywhere (the
#               community reference package is from Aug/2025 and misses what PeakCraft uses). So zJu4nn compiled it
#               from THIS repository at commit d05c4f55b8e0f987438d51a81c716cfbc6c9187f (dotnet build peak -c Release,
#               only the project's own build files, reviewed) and the dll is in hub/peak-plugin/, pinned by sha256 here.
# Upstream: https://github.com/aeironnsarmiento/PeakCraft (MIT), a port of https://github.com/chasmlol/SkyCraft (MIT).
name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PLUGIN_SHA256: 8eb79e84e626beb3665cc6776bed31443a004a875354e0bf0f57228828716f7d
    steps:
      - uses: actions/checkout@v4

      - name: Read hub.json
        id: hub
        shell: pwsh
        run: |
          $h = Get-Content hub.json -Raw | ConvertFrom-Json
          if ($h.formato -ne 2) { throw 'hub.json needs "formato": 2' }
          if ($h.versao -notmatch '^[\w.+-]{1,24}$' -or $h.pacote -notmatch '^[\w.+*-]{3,100}$') { throw 'bad versao/pacote in hub.json' }
          "versao=$($h.versao)" >> $env:GITHUB_OUTPUT
          "zip=$($h.pacote.Replace('*', $h.versao))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Minecraft mod (fabric/)
        shell: pwsh
        working-directory: fabric
        run: |
          ./gradlew.bat build --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'gradle build failed' }
          Get-ChildItem build/libs

      - name: PEAK plugin (pinned by sha256)
        shell: pwsh
        run: |
          $dll = 'hub/peak-plugin/aeironnarmiento.PeakCraft.dll'
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:PLUGIN_SHA256) { throw "plugin sha256 $sha does not match the pinned one" }
          "plugin ok: $sha"

      - name: Package
        shell: pwsh
        env:
          ZIP: ${{ steps.hub.outputs.zip }}
          VERSAO: ${{ steps.hub.outputs.versao }}
        run: |
          $jar = Get-ChildItem fabric/build/libs -Filter 'skycraft-*.jar' | Where-Object { $_.Name -notmatch '-sources' } | Select-Object -First 1
          if (-not $jar) { throw 'skycraft jar not found' }
          $p = 'dist/BepInEx/plugins/PeakCraft'
          New-Item -ItemType Directory -Force $p, dist/mods | Out-Null
          Copy-Item hub/peak-plugin/aeironnarmiento.PeakCraft.dll "$p/aeironnarmiento.PeakCraft.dll"
          Copy-Item LICENSE "$p/LICENSE.txt"
          Copy-Item $jar.FullName "dist/mods/$($jar.Name)"
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES.md
          @(
            "PeakCraft $env:VERSAO (build do zJu4nn Hub)",
            '',
            'Jogue o PEAK como um jogador de Minecraft. Somente solo.',
            'Original: github.com/aeironnsarmiento/PeakCraft (MIT), adaptacao do SkyCraft de chasmlol (MIT).',
            'Projeto de fas, sem ligacao com Mojang, Microsoft, Landfall ou Aggro Crab.'
          ) | Out-File -Encoding utf8 dist/LEIA.txt
          New-Item -ItemType Directory -Force out | Out-Null
          Push-Location dist
          7z a -tzip "../out/$env:ZIP" * -r | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          Pop-Location
          $sha = (Get-FileHash "out/$env:ZIP" -Algorithm SHA256).Hash.ToLower()
          "$sha  $env:ZIP" | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
          7z l "out/$env:ZIP"

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.hub.outputs.versao }}
          ZIP: ${{ steps.hub.outputs.zip }}
        run: |
          $tag = 'v' + $env:VERSAO
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag "out/$env:ZIP" out/SHA256SUMS.txt --title "PeakCraft $env:VERSAO (zJu4nn Hub)" --notes "Minecraft mod built from source here; PEAK plugin built by zJu4nn from commit d05c4f55 (pinned sha256 $env:PLUGIN_SHA256). Upstream: aeironnsarmiento/PeakCraft (MIT). Workflow at $env:GITHUB_SHA." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'release failed' }
